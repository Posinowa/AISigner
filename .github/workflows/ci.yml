name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET: ci-placeholder-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aisigner?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # #198: Yıkıcı (geriye-uyumsuz) migration guard — bağımlılık gerektirmez.
      - name: Migration safety check
        run: node scripts/check-migrations.mjs

      - name: Detect package scripts
        shell: bash
        run: |
          echo "HAS_LINT=$(node -e 'const p=require("./package.json"); process.stdout.write(p.scripts?.lint ? "true" : "false")')" >> "$GITHUB_ENV"
          echo "HAS_TYPECHECK=$(node -e 'const p=require("./package.json"); process.stdout.write(p.scripts?.typecheck ? "true" : "false")')" >> "$GITHUB_ENV"
          echo "HAS_TEST=$(node -e 'const p=require("./package.json"); process.stdout.write(p.scripts?.test ? "true" : "false")')" >> "$GITHUB_ENV"
          echo "HAS_BUILD=$(node -e 'const p=require("./package.json"); process.stdout.write(p.scripts?.build ? "true" : "false")')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        if: env.HAS_LINT == 'true'
        run: npm run lint

      - name: Skip lint
        if: env.HAS_LINT != 'true'
        run: echo "No lint script found. Skipping."

      - name: Run typecheck
        if: env.HAS_TYPECHECK == 'true'
        run: npm run typecheck

      - name: Skip typecheck
        if: env.HAS_TYPECHECK != 'true'
        run: echo "No typecheck script found. Skipping."

      - name: Run tests
        if: env.HAS_TEST == 'true'
        run: npm test

      - name: Skip tests
        if: env.HAS_TEST != 'true'
        run: echo "No test script found. Skipping."

      - name: Run build
        if: env.HAS_BUILD == 'true'
        run: npm run build

      - name: Skip build
        if: env.HAS_BUILD != 'true'
        run: echo "No build script found. Skipping."

  # ---------------------------------------------------------------------------
  # Bağımlılık güvenlik taraması (#469).
  #
  # ⚠️ EŞİK BİLEREK İKİYE BÖLÜNDÜ. Tek bir `npm audit` çalıştırıp her
  # bulguda CI'yı kırmak klasik bir tuzak: dev bağımlılıklarındaki geçişli
  # uyarıların çoğu düzeltilemiyor (upstream'i bekliyor) ve kırmızı CI
  # ilgisiz her işi bloke ediyor. Bir süre sonra ekip "audit'i yok say"
  # alışkanlığı ediniyor — yani tarama hiç olmamasından daha kötü hale
  # geliyor.
  #
  #   - BLOKE EDEN: yalnız ÜRETİM bağımlılıkları, yalnız high/critical.
  #     Bunlar kullanıcıya giden artefaktta yaşıyor ve aksiyon alınabilir.
  #   - BİLGİ AMAÇLI: dev dahil tam tarama, `continue-on-error` ile.
  #     Görünür olur ama işi durdurmaz.
  #
  # Ölçüm (bu PR yazılırken): her iki tarama da 0 açık veriyordu, yani eşik
  # bugün yeşil bir CI'yı kırmıyor.
  # ---------------------------------------------------------------------------
  guvenlik:
    name: dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm audit` kurulum gerektirmiyor; lockfile'dan çalışıyor.
      - name: Üretim bağımlılıkları — high/critical (BLOKE EDER)
        run: npm audit --omit=dev --audit-level=high

      - name: Tam tarama (dev dahil) — bilgi amaçlı
        continue-on-error: true
        run: npm audit

  # ---------------------------------------------------------------------------
  # Deploy edilen ASIL artefakt: imaj.
  #
  # ⚠️ Bu iş bir HATADAN doğdu. CI yalnızca `npm run build` koşuyordu ve o
  # geçiyordu; ama `docker build` #400'den beri KIRIKTI ve kimse fark etmedi.
  # Sebep: `NEXT_PUBLIC_APP_URL` CI'da env olarak tanımlı, Dockerfile'da ise
  # hiç geçirilmiyordu. Yani yeşil bir CI, deploy edilemeyen bir imajla
  # birlikte yaşayabiliyordu.
  #
  # Ayrı bir iş: ana CI'yı yavaşlatmıyor, paralel koşuyor. Yalnızca BUILD
  # ediyor, hiçbir yere push etmiyor — amaç imajın üretilebildiğini kanıtlamak.
  # ---------------------------------------------------------------------------
  docker:
    name: docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Değer client bundle'a gömüldüğü için build-arg ZORUNLU; burada
          # yalnızca imajın üretilebildiğini kanıtlıyoruz, bu yüzden CI'ya özel
          # bir yer tutucu yeterli. Gerçek deploy'da alan adı geçilmeli
          # (DEPLOYMENT.md §5).
          build-args: |
            NEXT_PUBLIC_APP_URL=https://ci.example.invalid
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
